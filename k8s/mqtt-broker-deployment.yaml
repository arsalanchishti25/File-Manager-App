              name: mqtt-data
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
            name: mqtt-broker-cm0
          name: mqtt-broker-cm0
        - name: mqtt-data
          persistentVolumeClaim:
