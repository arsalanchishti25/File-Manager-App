        - image: eclipse-mosquitto:latest
          livenessProbe:
            exec:
              command:
                - mosquitto_sub -t '$SYS/#' -C 1 -i healthcheck -W 3 || exit 1
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          name: filemanager-mqtt
