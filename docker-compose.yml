services:
  mysql:
    image: mysql:8.0
    container_name: filemanager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: filemanager
      MYSQL_USER: fileapp
      MYSQL_PASSWORD: fileapp123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - filemanager-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fileapp", "-pfileapp123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: filemanager-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    networks:
      - filemanager-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-app:
    image: file-manager/main-app:latest
    build:
      context: ./main-app
      dockerfile: Dockerfile
    container_name: filemanager-mainapp
    ports:
      - "3390:3389"
      - "2022:22"
    environment:
      SERVICE_ID: main-app-1
      SERVICE_TYPE: main-app
      DOCKER_NETWORK: filemanager-network
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: main-app-1
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: filemanager
      MYSQL_USER: fileapp
      MYSQL_PASSWORD: fileapp123
      MAIN_APP_ID: main-app-1
      SQLITE_DB_PATH: /data/fileapp.db
      APP_DATA_DIR: /data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
    volumes:
      - main-app-data:/data
    networks:
      - filemanager-network
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy

  load-balancer:
    image: file-manager/load-balancer:latest
    build:
      context: ./load-balancer
      dockerfile: Dockerfile
    container_name: filemanager-loadbalancer
    environment:
      SERVICE_ID: load-balancer
      SERVICE_TYPE: load-balancer
      DOCKER_NETWORK: filemanager-network
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: load-balancer
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy
      file-storage-1:
        condition: service_started
      file-storage-2:
        condition: service_started
      file-storage-3:
        condition: service_started
      file-storage-4:
        condition: service_started

  aggregator:
    image: file-manager/aggregator:latest
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    container_name: filemanager-aggregator
    environment:
      SERVICE_ID: agg-1
      SERVICE_TYPE: aggregator
      DOCKER_NETWORK: filemanager-network
      AGGREGATOR_ID: agg-1
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: agg-1
      SFTP_PORT: "2222"
      AGGREGATOR_WORK_DIR: /app/data
      WORKING_DIR: /app/data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - aggregator-data:/app/data
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  file-storage-1:
    image: file-manager/file-storage:latest
    build:
      context: ./file-storage
      dockerfile: Dockerfile
    container_name: filemanager-storage-1
    environment:
      SERVICE_ID: fs-1
      SERVICE_TYPE: file-storage
      DOCKER_NETWORK: filemanager-network
      FS_CONTAINER_ID: fs-1
      VOLUME_GROUP: "1"
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: fs-1
      STORAGE_PORT: "8082"
      SFTP_PORT: "2201"
      STORAGE_DATA_DIR: /storage/data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
    ports:
      - "2201:2201"
    volumes:
      - storage-volume-1:/storage/data
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  file-storage-2:
    image: file-manager/file-storage:latest
    build:
      context: ./file-storage
      dockerfile: Dockerfile
    container_name: filemanager-storage-2
    environment:
      SERVICE_ID: fs-2
      SERVICE_TYPE: file-storage
      DOCKER_NETWORK: filemanager-network
      FS_CONTAINER_ID: fs-2
      VOLUME_GROUP: "2"
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: fs-2
      STORAGE_PORT: "8083"
      SFTP_PORT: "2202"
      STORAGE_DATA_DIR: /storage/data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
    ports:
      - "2202:2202"
    volumes:
      - storage-volume-2:/storage/data
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  file-storage-3:
    image: file-manager/file-storage:latest
    build:
      context: ./file-storage
      dockerfile: Dockerfile
    container_name: filemanager-storage-3
    environment:
      SERVICE_ID: fs-3
      SERVICE_TYPE: file-storage
      DOCKER_NETWORK: filemanager-network
      FS_CONTAINER_ID: fs-3
      VOLUME_GROUP: "3"
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: fs-3
      STORAGE_PORT: "8084"
      SFTP_PORT: "2203"
      STORAGE_DATA_DIR: /storage/data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
    ports:
      - "2203:2203"
    volumes:
      - storage-volume-3:/storage/data
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  file-storage-4:
    image: file-manager/file-storage:latest
    build:
      context: ./file-storage
      dockerfile: Dockerfile
    container_name: filemanager-storage-4
    environment:
      SERVICE_ID: fs-4
      SERVICE_TYPE: file-storage
      DOCKER_NETWORK: filemanager-network
      FS_CONTAINER_ID: fs-4
      VOLUME_GROUP: "4"
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      MQTT_CLIENT_ID: fs-4
      STORAGE_PORT: "8085"
      SFTP_PORT: "2204"
      STORAGE_DATA_DIR: /storage/data
      SFTP_USER: sftpuser
      SFTP_PASSWORD: sftppass123
    ports:
      - "2204:2204"
    volumes:
      - storage-volume-4:/storage/data
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

  host-manager:
    image: file-manager/host-manager:latest
    build:
      context: ./host-manager
      dockerfile: Dockerfile
    container_name: filemanager-host-manager
    environment:
      HOST_MANAGER_ID: hm-1
      MQTT_BROKER_URL: tcp://filemanager-mqtt:1883
      FILE_STORAGE_IMAGE: file-manager/file-storage:latest
      AGGREGATOR_IMAGE: file-manager/aggregator:latest
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - filemanager-network
    depends_on:
      mqtt-broker:
        condition: service_healthy

networks:
  filemanager-network:
    name: filemanager-network
    driver: bridge

volumes:
  mysql-data:
  mqtt-data:
  main-app-data:
  aggregator-data:
  storage-volume-1:
  storage-volume-2:
  storage-volume-3:
  storage-volume-4:
